[project]
name = "basedpyright"
description = "static type checking for Python (but based)"
dynamic = ["version"]
authors = [
    { name = "detachhead", email = "detachhead@users.noreply.github.com" },
]
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.8"
dependencies = [
    # required by the basedpyright cli & langserver wrapper scripts. only binaries are required (no cli)
    # since the user shouldn't have a node/npm binary unknowingly added to their PATH
    "nodejs-wheel-binaries>=20.13.1",
]
[dependency-groups]
dev = [
    "pylint>=3.0.0a7",
    "ruff>=0.2.2",
    "pdm-backend>=2.3.0",
    "typing_extensions>=4.12.2",
    "pytest>=8.2.2",
    "pytest-github-actions-annotate-failures>=0.2.0",
    "mkdocs-material>=9.5.37",
    "mkdocs-awesome-pages-plugin>=2.9.2",
    "mike>=2.1.3",
    "mkdocs-macros-plugin>=1.2.0",
    "lsp-devtools>=0.2.3",
    "zizmor>=1.2.0",
]
docstubs = [
    # these deps are also needed in build-system.requires. see https://github.com/pdm-project/pdm/issues/2947
    "docify>=1.0.0",
]
lochelper = ["rich>=13.0", "textual>=0.70.0"]

[build-system]
build-backend = "pdm.backend"
requires = [
    "pdm-backend>=2.3.0",
    # used in pdm_build.py:
    "typing_extensions>=4.12.2",
    "docify>=1.0.0",
]

[project.urls]
repository = "https://github.com/detachhead/basedpyright"

[project.scripts]
basedpyright = 'basedpyright.pyright:main'
basedpyright-langserver = 'basedpyright.langserver:main'


[tool.uv]
default-groups = ["dev", "docstubs", "lochelper"]
# transient dependency of docify. needed because there's no single version with wheels for 3.8-3.13 and it fails to build when there's no wheels
no-build-package = ["libcst"]
exclude-newer = "1 week"


[tool.pdm.version]
source = "call"
getter = "build.py3_8.version:get"

[tool.pdm.build]
excludes = ["tests/", "pdm_build.py"]
source-includes = [
    "build",
    "docstubs",
    "packages/pyright",
    "packages/pyright-internal",
    "package.json",
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
    "tsconfig.json",
    "gg.cmd",
    "gg.toml",
]

[tool.pylint.MASTER]
fail-on = "I"
bad-names = ["foo", "bar", "baz", "retval"]
load-plugins = [
    # we don't use all of these but enabling them all for completeness since there's no error if a rule is not found
    "pylint.extensions.bad_builtin",
    "pylint.extensions.broad_try_clause",
    "pylint.extensions.check_elif",
    "pylint.extensions.code_style",
    "pylint.extensions.comparetozero",
    "pylint.extensions.comparison_placement",
    "pylint.extensions.confusing_elif",
    "pylint.extensions.consider_refactoring_into_while_condition",
    "pylint.extensions.consider_ternary_expression",
    "pylint.extensions.dict_init_mutate",
    "pylint.extensions.docparams",
    "pylint.extensions.docstyle",
    "pylint.extensions.dunder",
    "pylint.extensions.empty_comment",
    "pylint.extensions.emptystring",
    "pylint.extensions.eq_without_hash",
    "pylint.extensions.for_any_all",
    "pylint.extensions.magic_value",
    "pylint.extensions.no_self_use",
    "pylint.extensions.overlapping_exceptions",
    "pylint.extensions.private_import",
    "pylint.extensions.redefined_loop_name",
    "pylint.extensions.redefined_variable_type",
    "pylint.extensions.set_membership",
    "pylint.extensions.typing",
    "pylint.extensions.while_used",
]

[tool.pylint."MESSAGE CONTROL"]
disable = ["R", "C", "E", "F", "W", "I"]
enable = [
    "useless-suppression",
    "fatal",
    # rules that have not yet been implemented in ruff. once all of these are implemented in ruff, we should remove pylint
    # (see https://github.com/astral-sh/ruff/issues/970):
    "access-member-before-definition",
    "assignment-from-none",
    "dict-iter-missing-items",
    "invalid-bool-returned",
    "invalid-getnewargs-ex-returned",
    "invalid-getnewargs-returned",
    "invalid-length-hint-returned",
    "invalid-slice-index",
    "invalid-slice-step",
    "invalid-slots",
    "invalid-slots-object",
    "invalid-unicode-codec",
    "logging-format-truncated",
    "logging-unsupported-format",
    "method-hidden",
    "modified-iterating-dict",
    "potential-index-error",
    "relative-beyond-top-level",
    "abstract-method",
    "arguments-out-of-order",
    "attribute-defined-outside-init",
    "confusing-with-statement",
    "deprecated-decorator",
    "deprecated-module",
    "differing-param-doc",
    "global-variable-undefined",
    "missing-param-doc",
    "modified-iterating-list",
    "multiple-constructor-doc",
    "non-parent-init-called",
    "overlapping-except",
    "preferred-module",
    "raising-format-tuple",
    "redefined-outer-name",
    "redundant-returns-doc",
    "redundant-yields-doc",
    "useless-param-doc",
    "useless-parent-delegation",
    "useless-type-doc",
    "using-constant-test",
    "bad-file-encoding",
    "dict-init-mutate",
    "use-implicit-booleaness-not-comparison",
    "chained-comparison",
    "confusing-consecutive-elif",
    "consider-using-augmented-assign",
    "consider-using-join",
    "consider-using-max-builtin",
    "consider-using-min-builtin",
    "consider-using-namedtuple-or-dataclass",
    "consider-using-tuple",
    "simplifiable-condition",
    "simplify-boolean-expression",
]

[tool.pylint.REPORTS]
reports = "no"
output-format = "colorized"
score = "no"

[tool.pylint.FORMAT]
max-line-length = 200

[tool.basedpyright]
pythonVersion = "3.8"
# https://github.com/DetachHead/basedpyright/issues/31
ignore = ["basedpyright/dist", "packages", "docstubs", "node_modules", ".venv"]
exclude = ["basedpyright/dist", "packages", "docstubs", "node_modules", ".venv"]
reportImplicitStringConcatenation = false                                        # conflicts with ruff formatter
reportIncompatibleUnannotatedOverride = 'error'
reportUnannotatedClassAttribute = 'none'

executionEnvironments = [
    { root = 'build/py_latest', pythonVersion = '3.14' },
    { root = 'tests', pythonVersion = '3.14' },
    { root = 'mypy_primer', pythonVersion = '3.11' },
]


[tool.ruff]
target-version = "py38"
respect-gitignore = true
line-length = 100
preview = true
unsafe-fixes = true
extend-exclude = [
    "packages/pyright-internal/typeshed-fallback",
    "docstubs",
    "packages/pyright-internal/src/typeServer",
    "packages/pyright-internal/src/tests/samples",
    "packages/pyright-internal/src/tests/benchmarkData",
    "build/py_latest/upstream",
    "mypy_primer",                                       # upstream uses black & flake8
]

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    # conflicts with or covered by another tool:
    "ANN",                                       # flake8-annotations (covered by basedpyright)
    "invalid-all-format",                        # covered by basedpyright
    "implicit-optional",                         # covered by basedpyright
    "invalid-index-type",                        # covered by basedpyright
    "overload-with-docstring",                   # basedpyright supports it
    "single-line-implicit-string-concatenation", # conflicts with formatter
    "missing-trailing-comma",                    # conflicts with formatter
    "useless-import-alias",                      # used by basedpyright for explicit re-export
    "deprecated-import",                         # covered by basedpyright deprecateTypingAliases
    "non-pep585-annotation",                     # covered by basedpyright deprecateTypingAliases
    "non-pep604-annotation-union",               # covered by basedpyright deprecateTypingAliases

    # rules i disabled because i don't like them:
    "EM",                                  # flake8-errmsg
    "FIX",                                 # flake8-fixme
    "too-many-arguments",
    "too-many-branches",
    "too-many-statements",
    "magic-value-comparison",
    "sys-exit-alias",
    "redefined-loop-name",
    "too-many-return-statements",
    "global-statement",
    "type-name-incorrect-variance",
    "raise-vanilla-class",
    "raise-vanilla-args",
    "D10",
    "incorrect-blank-line-before-class",
    "missing-blank-line-after-summary",
    "multi-line-summary-first-line",
    "missing-trailing-period",
    "non-imperative-mood",
    "first-word-uncapitalized",
    "docstring-starts-with-this",
    "non-capitalized-section-name",
    "missing-new-line-after-section-name",
    "missing-terminal-punctuation",
    "pytest-incorrect-pytest-import",      # only for bad linters that can't check the qualname
    "missing-todo-author",
    "missing-copyright-notice",
    "complex-structure",
    "docstring-missing-yields",
    "docstring-missing-returns",
    "runtime-cast-value",                  # quoted types look disgusting
]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.per-file-ignores]
"*.pyi" = [
    # we don't control names in 3rd party modules
    "builtin-variable-shadowing",
    "builtin-argument-shadowing",
    "N",
]
"{tests,build}/**/*.py" = [
    "S",     # none of these security focused rules are relevant for tests/build scripts
    "print",
]

[tool.ruff.lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
xfail_strict = true
addopts = ['--strict-markers']
markers = [
    'needs_all_docstubs', # indicates that the test needs to run after the docstubs are built, rather than during validation
]
